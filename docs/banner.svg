<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Energy Flow Atlas banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d33"/>
      <stop offset="1" stop-color="#081221"/>
    </linearGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e6da4"/><stop offset="1" stop-color="#4fc3f7"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6d3b"/><stop offset="1" stop-color="#e8b04b"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f7d5a"/><stop offset="1" stop-color="#7ed491"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- Sankey: sources converge to converter, split to outputs -->
  <g transform="translate(70,40)">
    <!-- left sources -->
    <rect x="0" y="30" width="16" height="34" rx="3" fill="#4fc3f7"/>
    <rect x="0" y="95" width="16" height="52" rx="3" fill="#e8b04b"/>
    <rect x="0" y="175" width="16" height="26" rx="3" fill="#7ed491"/>
    <!-- ribbons to middle node -->
    <path d="M 16 47 C 160 47, 200 70, 330 70 L 330 112 C 200 112, 160 121, 16 64 Z" fill="url(#r1)" opacity="0.85"/>
    <path d="M 16 121 C 150 121, 210 118, 330 118 L 330 152 C 210 152, 150 147, 16 147 Z" fill="url(#r2)" opacity="0.85"/>
    <path d="M 16 188 C 160 188, 210 160, 330 160 L 330 176 C 210 176, 160 201, 16 201 Z" fill="url(#r3)" opacity="0.85"/>
    <!-- middle node -->
    <rect x="330" y="62" width="18" height="118" rx="3" fill="#d7e3f0"/>
    <!-- split ribbons to right -->
    <path d="M 348 74 C 470 74, 500 60, 610 60 L 610 92 C 500 92, 470 108, 348 106 Z" fill="url(#r1)" opacity="0.85"/>
    <path d="M 348 108 C 470 108, 500 130, 610 130 L 610 178 C 500 178, 470 154, 348 172 Z" fill="url(#r3)" opacity="0.85"/>
    <!-- right nodes -->
    <rect x="610" y="56" width="16" height="40" rx="3" fill="#4fc3f7"/>
    <rect x="610" y="126" width="16" height="56" rx="3" fill="#7ed491"/>
    <!-- conservation check -->
    <circle cx="530" cy="228" r="14" fill="none" stroke="#7ed491" stroke-width="3"/>
    <path d="M 523 228 l 5 6 l 10 -12" stroke="#7ed491" stroke-width="3.5" fill="none"/>
    <text x="552" y="234" fill="#9fb8ce" font-family="Consolas, monospace" font-size="16">Σ in = Σ out at every node</text>
    <text x="20" y="240" fill="#9fb8ce" font-family="Consolas, monospace" font-size="16">one quantity · one unit · one scale</text>
  </g>
  <!-- wordmark -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="770" y="125" fill="#ffffff" font-size="54" font-weight="800" letter-spacing="0.5">Energy <tspan fill="#e8b04b">Flow</tspan> Atlas</text>
    <text x="772" y="168" fill="#9fb8ce" font-size="21">Sankey diagrams whose geometry follows the ledger</text>
    <text x="772" y="205" fill="#5b7a99" font-family="Consolas, monospace" font-size="15">validated conservation · fixed physical scale</text>
  </g>
</svg>
